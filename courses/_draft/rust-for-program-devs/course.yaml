# ── Positioning seam vs rust-ts-fundamentals (pr54) — owner-approved 2026-09-05 ──
# Both courses answer "I'm a JS dev, teach me Rust." This course is the PATH RUNG:
# zero-install, build-server graded, anchor-lang dialect, one artifact
# (vault_core.rs) that C3 consumes. rust-ts-fundamentals is the ELECTIVE:
# real-software generalist, local rustup/cargo by design. State the no-local-
# toolchain differentiator against rust-ts-fundamentals explicitly, not only
# against external competitors — done in your-first-rust-build/intro.md, with the
# skip affordance (its m04–m05 covers M1–M3 here; checkpoint quiz, start at M3/M4).
# Exercise names: pr54 ships near-twin graded challenges — its m04-l1
# "fix-the-borrow" and m04-l2 checked-math (station_funding) mirror this course's
# fix-the-borrow-checker and checked-lamport-math. Do NOT reuse those exact
# graded-exercise names, OR deliberately share them and say so in both lessons —
# identical unexplained challenge names read as copy-paste to a learner taking both.
id: course-rust-for-program-devs
slug: rust-for-program-devs
title: Rust for Program Developers
description: >-
  You can read a Solana account's bytes. You cannot yet write the struct those
  bytes came from. You finish this course holding `vault_core.rs` — a
  `VaultState` with `owner`, `balance` and `bump`, `deposit` and `withdraw`
  built on `checked_add`/`checked_sub` so a `u64` can never silently wrap, a
  `VaultError` enum with four named variants, and not one `unwrap()` — compiled
  green against the real Anchor 1.x toolchain on our build server. Nothing is
  installed locally — no rustup, no cargo, no `.so` upload. Ownership,
  borrowing and lifetimes are taught here rather than deferred, because
  `Account<'info, Vault>` is unreadable without them. Your file deliberately
  carries no `#[program]` and no `#[derive(Accounts)]` — that omission is the
  handoff, and Course 3 is what wraps around it.
difficulty: intermediate
duration: 12
xpPerLesson: 20
xpReward: 800
creatorRewardXp: 30
minCompletionsForReward: 10
trackId: 1
trackLevel: 2
creator: B7o8NfV81HzjuZFWQTTx3Xdvh77Dqoajwib3kWEnvzJF
modules:
  - key: rpd-rust-that-compiles
    title: Rust That Compiles
    description: >-
      Get a green build before learning any syntax, then meet exactly the types
      the vault needs — `u64` lamports, `u8` bump, `i64` timestamps — and the
      compiler's opinions about mutability, tail expressions and the missing
      `return`. You end holding a file of your own — two `const fn` helpers
      that add and subtract lamports and return `None` on overflow or underflow
      instead of wrapping or panicking, verified by compile-time assertions.
      That arithmetic becomes `VaultState::withdraw` nine lessons later.
    lessons:
      - lesson-rpd-your-first-rust-build
      - lesson-rpd-types-and-mutability
      - lesson-rpd-functions-and-control-flow
      - lesson-rpd-checked-lamport-math
  - key: rpd-ownership-borrowing-lifetimes
    title: Ownership, Borrowing, Lifetimes
    description: >-
      Moves, `Copy`, `.clone()`, shared versus mutable borrows, and lifetimes —
      taught against account-shaped signatures instead of toy strings, and with
      the compiler as the teacher. You read four real borrow-checker errors
      (E0382, E0502, E0499, and a reference outliving its local) and repair
      each one. You leave with three functions compiling in your own file —
      `balance_of(&VaultLike) -> u64`, `credit(&mut VaultLike, u64)` and
      `discriminator(&[u8]) -> Option<&[u8]>`, a real borrowed reader over
      Anchor's 8-byte discriminator. The first two are the exact method
      receivers you write in module 4, and the `'info` in
      `Account<'info, Vault>` stops being noise.
    lessons:
      - lesson-rpd-moves-copy-and-clone
      - lesson-rpd-borrowing-shared-vs-mutable
      - lesson-rpd-fix-the-borrow-checker
      - lesson-rpd-lifetimes-and-slices
      - lesson-rpd-ownership-checkpoint
  - key: rpd-modeling-state
    title: "Modeling State: Structs, Enums, Result"
    description: >-
      The vault's data model, compiling. Define `VaultState` and hand-write one
      of the traits `#[derive]` would have generated, so the macro stops being
      magic and the byte layout stops being a mystery. Define `VaultError`,
      then add a fifth variant just to watch the compiler enumerate every site
      you failed to handle. Finally, replace panics with `Result` and let `?`
      carry errors up a chain of fallible functions, converting between error
      types on the way through.
    lessons:
      - lesson-rpd-structs-traits-and-derives
      - lesson-rpd-enums-option-result
      - lesson-rpd-error-plumbing
  - key: rpd-the-vault-core
    title: The Vault Core
    description: >-
      Write the whole core — `VaultState`, checked `deposit` and `withdraw`,
      `VaultError`, an inline `mod` and its `use` — first by completing a given
      skeleton, then from signatures alone against a fixed verification harness
      you are not allowed to edit. You close by rereading your own file line by
      line, mapping each line back to the lesson that produced it, and copying
      it out. `vault_core.rs` is the named input to Course 3.
    lessons:
      - lesson-rpd-build-the-vault-core
      - lesson-rpd-what-you-built
