id: course-stablecoin-payments
slug: stablecoin-agentic-payments
title: "Getting Paid: Stablecoin & Agentic Payments"
description: Put a price on an app that earns nothing. If you came through Course 4 that app is the vault you deployed and published a client for; if you are starting here, this is the segment's entry point and a frozen reference deployment stands in for it. Open a Subscription Authority and a Recurring Delegation so the app has a real paid tier, meter a route with an x402 v2 challenge, and give an autonomous agent a wallet that can say no — an on-chain spend cap instead of an unlimited keypair. TypeScript only, no Rust and no local toolchain. You finish by publishing a version-pinned deep dive and submitting one live Superteam Earn listing. Scope is what BCB Resolution 561 leaves open to Brazilian builders from 2026-10-01, domestic merchant acceptance, contractor payouts, subscriptions and agent budgets.
difficulty: intermediate
duration: 10
xpPerLesson: 25
xpReward: 750
creatorRewardXp: 30
minCompletionsForReward: 10
trackId: 1
trackLevel: 5
