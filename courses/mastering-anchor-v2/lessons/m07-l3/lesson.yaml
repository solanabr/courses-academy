id: lesson-mav2-m07-l3
slug: m07-l3
title: "The audit checklist as a lab; fuzz as the assessment"
versionStamp:
  checkedAt: "2026-09-07"
  packages:
    anchor-cli: "1.2.0"
    crucible-fuzz-cli: "0.2.1"
    crucible-fuzzer: "0.2.1"
skills:
  - program-security
  - program-testing
  - checked-arithmetic
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: check
    type: quiz
    questions:
      - id: q1
        prompt: "After hours of clean runs, `anchor fuzz` reports a crash on your swap. In this lesson's framing, what does that mean?"
        multiSelect: false
        options:
          - id: d
            label: "The chain reached a state your setup did not intend, so the fixture usually needs a reseed and a re-run."
            correct: false
            feedback: "A state the fuzzer chained its way into out of otherwise-valid calls is a reachable state, and reachable is the only bar that matters: the attacker gets the same calls you gave the harness. Deep states are what `--stateful` exists to produce, not a fixture defect to reseed away."
          - id: c
            label: "You broke it: the fuzzer found a concrete input for which your invariants do not hold."
            correct: true
            feedback: "Order matters as much as the finding: keep the artifact, replay it, and patch after. Go the other way and you have thrown out the one thing proving the input was real and repeatable."
          - id: b
            label: "sBPF edge coverage was still climbing, so the crash is a false positive from a half-explored branch."
            correct: false
            feedback: "A crash artifact is a concrete failing input sequence you can replay; low coverage means you have not explored enough of the program yet, not that the crash you already have is fake."
          - id: a
            label: "Crucible's LibAFL mutator produced a malformed input; re-run the campaign until it comes back clean."
            correct: false
            feedback: "Crucible saves the failing sequence as a crash artifact and replays it deterministically with `--replay`, so a reproducible crash is a finding, not mutator noise, and that is the entire point of running it."
        explanation: "In this course, a green fuzz case = you broke it: anchor fuzz (Crucible, LibAFL/LiteSVM with sBPF edge coverage) surfaced an input that violates an invariant. Replay the crash artifact, fix the bug, and re-fuzz: a crash is a success of the process. The order is load-bearing: crash, replay, patch, re-fuzz. Patch first and you throw away the artifact that proved the bug was real and deterministic."
      - id: q2
        prompt: "A teammate on an Anchor master build runs `anchor fuzz`. Which tool actually runs under the hood?"
        multiSelect: false
        options:
          - id: c
            label: "cargo-fuzz with libFuzzer, over a native (non-sBPF) build."
            correct: false
            feedback: "anchor fuzz executes the compiled `.so` inside LiteSVM and traces sBPF edges; cargo-fuzz/libFuzzer would instrument a native host build, which is not the bytecode that runs on-chain."
          - id: b
            label: "Trident (Ackee), wired in as the default `fuzz` backend."
            correct: false
            feedback: "Trident is a real, maintained alternative, but it is not the built-in path: its last stable is 0.12.0 from 2025-11-27, with the 0.13.0 line still on release candidates (rc.4, 2026-05-14), and Anchor wired Crucible into the CLI instead."
          - id: e
            label: "A LibAFL engine driving a real solana-test-validator, for on-chain runtime fidelity."
            correct: false
            feedback: "LibAFL is right and the runtime under it is not. Crucible drives LiteSVM in process, which is what makes a campaign of millions of iterations affordable and what lets it clone and keep whole program states in a pool. A real validator per iteration would cost more than the search is worth."
          - id: a
            label: "Crucible (`crucible-fuzz-cli`), a LibAFL engine driving a LiteSVM runtime."
            correct: true
            feedback: "Verified 2026-08-22: that subcommand lives on master, which pins the crate at 0.2.1; the RC branch's CLI has no fuzz command at all."
          - id: d
            label: "Anchor's own fuzz engine, added to the CLI beside `anchor coverage` and `anchor debugger`."
            correct: false
            feedback: "The subcommand is Anchor's; the engine underneath is not. Crucible is built by Asymmetric Research and consumed as `crucible-fuzz-cli`, and the two CLI lines make the split visible: the V1 line's 1.2.0 pins Crucible and dispatches Fuzz into it, while the 2.0.0-rc.1 CLI is the one that ships `anchor coverage` and `anchor debugger` and has no fuzz subcommand at all."
        explanation: "anchor fuzz is Crucible (crucible-fuzz-cli), embedded in the CLI, using a LibAFL/LiteSVM backend with sBPF edge coverage. Trident (Ackee) is a one-paragraph alternative that has not cut a stable release since 0.12.0 (2025-11-27) and is still on 0.13.0 release candidates; it is not the default. Checked 2026-09-07: it is the V1 line's CLI, released as anchor-cli 1.2.0 on 2026-09-04, that pins `crucible-fuzz-cli = \"0.2.1\"` and dispatches `Command::Fuzz` into it, while the 2.0.0-rc.1 CLI ships `anchor coverage` and has no `fuzz` subcommand at all."
      - id: q3
        prompt: "Your audit checklist passes and fuzzing is clean. A stakeholder asks 'so it is proven secure?' What is the grounded answer?"
        multiSelect: false
        options:
          - id: d
            label: "Proven for the invariants you wrote, since a stateful run covers the reachable state space."
            correct: false
            feedback: "Stateful fuzzing reaches deeper than stateless, and reaching deeper is not the same as reaching everything: it keeps a coverage-keyed pool and grows chains toward whatever looks new, which narrows the gap without closing it. There is no run length that turns an average-case clean into a worst-case safe, for the invariants you wrote or any others."
          - id: a
            label: "Yes: a clean stateful fuzz run plus a fully green checklist is a proof of correctness."
            correct: false
            feedback: "A clean run is an average-case statement over the inputs and sequences the fuzzer happened to explore in the time you gave it; the bug that ships is usually a worst-case corner the search never reached."
          - id: c
            label: "Yes, once you also run Trident, whose Ackee harness adds proof-grade coverage of the state space."
            correct: false
            feedback: "No fuzzer is proof-grade. Trident is coverage-guided testing exactly like Crucible, it is not even the built-in path, and running a second fuzzer would not turn testing into proof."
          - id: b
            label: "No: a clean run means 'not found yet', confidence and never proof."
            correct: true
            feedback: "The claim a clean campaign supports is average-case, over whatever the search reached in the time you gave it, and nothing more. Only the model checkers in that toolchain make proof-shaped claims, and only over narrow properties."
        explanation: "Fuzzing found 4 correctness bugs in Anchor's OWN framework, which also carries Miri witnesses and Kani configs, and that record, not any hedging line in the project's docs (there is none; the README claims 'secure by default'), is why this course insists the defaults are no substitute for review. Testing and audit raise confidence; they never prove the absence of bugs. Of that toolchain only Miri (undefined behavior in unsafe code) and Kani (bounded model checking) make proof-shaped claims at all, and only about the narrow properties they model."
      - id: q4
        prompt: "You want the fuzzer to explore state that only appears after several instructions run in sequence. Which run mode fits?"
        multiSelect: false
        options:
          - id: a
            label: "The stateless default is enough, since depth accrues across runs that restart from setup."
            correct: false
            feedback: "Stateless clones the post-setup snapshot every iteration and throws the world away afterwards, so nothing accrues: every attempt re-pays for the first steps and stops at `--max-actions` (default 8)."
          - id: c
            label: "`anchor fuzz run` with `--stateful`, so mutated actions extend live states instead of restarting."
            correct: true
            feedback: "It keeps a coverage-keyed pool of live states and applies one mutated action to a state drawn out of it, so chains deepen instead of resetting. Coverage is a readout; it was never a mode."
          - id: d
            label: "`anchor fuzz run` with a larger `--pool-size`, since the pool size is what deepens the chains."
            correct: false
            feedback: "`--pool-size` describes the pool of live states that only exists in stateful mode, and it defaults to 256,000 already. Without the mode flag there is no pool to enlarge, and even inside it the knob that governs chain length is `--max-depth`. The mode is the decision; the sizes are tuning."
          - id: b
            label: "`anchor coverage`, since its LCOV export is what steers the fuzzer into deeper program states."
            correct: false
            feedback: "anchor coverage is a readout over `anchor test` traces, and fuzz coverage comes from `run --coverage`. Either way coverage is the map, not the vehicle; `--stateful` is what actually gets you there."
        explanation: "anchor fuzz run ... --stateful chains instructions so the fuzzer can reach states that only exist after a sequence of calls, the ones a single-shot run never sees. Coverage (LCOV) is a separate readout, not the mode. Mechanically: stateful keeps a coverage-indexed pool of live program states (`--pool-size`, default 256,000) and applies one mutated action per iteration to a state drawn from that pool, growing chains to `--max-depth` (default 15), while the stateless default clones the post-setup snapshot, runs a mutated sequence up to `--max-actions` (default 8), and discards it."
