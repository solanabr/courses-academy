<!-- comparison: Burst vs pool, from the target's side
     purpose: show that the same fifty probes arrive as one spike or as a steady trickle depending on who bounds them
     data: Panel A "Promise.all of 50 fetches": 50 arrows leaving at t=0, hitting a wall labeled "cap: 25/sec" with 25 passing and 25 bouncing back as 429. Measured: 25/50 rejected. Panel B "pool of 5 workers, 250ms latency": arrows leaving in waves of 5, 20 req/s, all passing under the same wall. Measured: 0/50 rejected, 2561ms total.
     prompt: Side-by-side two-panel comparison. Both panels show a client on the left, a server wall on the right with a gate labeled with the cap. Panel A: a dense fan of 50 arrows all at time zero, half deflected back with a 429 label. Panel B: small groups of 5 arrows spaced along a time axis, all passing through. Under each panel one measured stat line as given in data.
     BUILD .viz as on-brand HTML per skills/content-gen/references/visual-rendering.md.
     Header: <div class="stbr-eyebrow">..</div> + <h2 class="viz-title">..</h2>.
     Leave the .stbr-decor block untouched (per-asset brand decoration).
     WeasyPrint-safe CSS only: flexbox/grid/borders/gradients; NO box-shadow, NO
     background-image url(), NO JS. Use brand tokens (--surface-*, --text-*, --stbr-*). -->
