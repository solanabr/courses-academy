<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../_brand.css">
<link rel="stylesheet" href="../_render.css">
<style>
  @page { size: 1600px 900px; margin: 0; }
  html, body { margin: 0; }
  body { width: 1600px; height: 900px; display: flex; align-items: center;
         justify-content: center; background: var(--surface-page); padding: 72px; }
  .viz { position: relative; width: 100%; }
</style></head>
<body>
<!-- timeline: The prover got a rebuild
     purpose: ground the claim that types are load-bearing infrastructure, not lint, in the compiler's own 2025 to 2026 arc
     data: March 2025: Microsoft announces the native port of the TypeScript compiler to Go 2026-07-08: the port ships as TypeScript 7 GA Reading: an ecosystem rebuilds its proof engine for speed only when the proofs are load-bearing
     prompt: Minimal two-point horizontal timeline. Left node: March 2025, announcement of the Go port. Right node: 2026-07-08, TypeScript 7 GA. A single annotation beneath spanning both: "you rebuild the prover when the proofs hold the building up". No other data points.
     BUILD .viz as on-brand HTML per skills/content-gen/references/visual-rendering.md.
     Header: <div class="stbr-eyebrow">..</div> + <h2 class="viz-title">..</h2>.
     Leave the .stbr-decor block untouched (per-asset brand decoration).
     WeasyPrint-safe CSS only: flexbox/grid/borders/gradients; NO box-shadow, NO
     background-image url(), NO JS. Use brand tokens (--surface-*, --text-*, --stbr-*). -->
<div class="stbr-decor" aria-hidden="true">
  <div style="position:absolute;width:579px;height:517px;top:-333px;right:-333px;border-radius:49% 43% 53% 39% / 40% 58% 64% 58%;background:#306c40;opacity:0.5;"></div>
  <div style="position:absolute;width:474px;height:410px;left:-246px;top:127px;border-radius:43% 61% 62% 59% / 38% 52% 54% 64%;background:#008b4c;opacity:0.5;"></div>
</div>
<div class="viz">
  <style>
    .v03-card{background:var(--surface-card);border-radius:var(--radius-2xl);padding:44px 60px 40px;}
    .v03-node-lbl{font-family:var(--font-display);font-weight:800;font-size:24px;color:var(--text-primary);line-height:1.15;}
    .v03-node-sub{font-family:var(--font-body);font-size:18px;color:var(--text-secondary);margin-top:8px;line-height:1.35;}
    .v03-date{display:inline-block;font-family:var(--font-mono);font-size:17px;font-weight:600;
              padding:6px 14px;border-radius:var(--radius-pill);margin-bottom:12px;}
  </style>
  <div class="v03-card">
    <div class="stbr-eyebrow">TYPES ARE LOAD-BEARING</div>
    <h2 class="viz-title">the prover got a rebuild</h2>
    <div style="position:relative;margin:40px 60px 24px;height:320px;">
      <div style="position:absolute;left:20px;top:0;width:480px;">
        <div class="v03-date" style="background:var(--surface-brand);color:var(--text-on-brand);">March 2025</div>
        <div class="v03-node-lbl">the announcement</div>
        <div class="v03-node-sub">Microsoft announces the native port of the TypeScript compiler to Go</div>
      </div>
      <svg width="1180" height="36" style="position:absolute;left:0;top:142px;display:block;">
        <line x1="10" y1="18" x2="1170" y2="18" stroke="#008b4c" stroke-width="5"/>
        <circle cx="120" cy="18" r="14" fill="#008b4c"/>
        <circle cx="1040" cy="18" r="16" fill="#ffd23f" stroke="#1b231d" stroke-width="3"/>
      </svg>
      <div style="position:absolute;left:660px;top:196px;width:480px;text-align:right;">
        <div class="v03-date" style="background:var(--surface-accent);color:var(--text-on-accent);">2026-07-08</div>
        <div class="v03-node-lbl">TypeScript 7 GA</div>
        <div class="v03-node-sub">the Go port ships: the proof engine, rebuilt for speed</div>
      </div>
    </div>
    <div style="background:var(--surface-brand);color:var(--text-on-brand);border-radius:var(--radius-xl);
                padding:22px 32px;font-family:var(--font-display);font-weight:800;font-size:27px;text-align:center;">
      you rebuild the prover when the proofs hold the building up
    </div>
  </div>
</div>
</body></html>
