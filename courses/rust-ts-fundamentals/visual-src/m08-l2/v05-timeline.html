<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../_brand.css">
<link rel="stylesheet" href="../_render.css">
<style>
  @page { size: 1600px 900px; margin: 0; }
  html, body { margin: 0; }
  body { width: 1600px; height: 900px; display: flex; align-items: center;
         justify-content: center; background: var(--surface-page); padding: 72px; }
  .viz { position: relative; width: 100%; }
</style></head>
<body>
<!-- timeline: Two kit majors in ten weeks
     purpose: ground the pin-by-peer-range rule in the release history that makes digit-pinning untenable
     data: 2026-06-16: @solana/kit 6.10.0 published (a 6.x minor) 2026-06-30: 7.0.0 published 2026-08-21: 8.0.0 published 2026-09-02 (write-time probe): latest resolves to 8.2.0 annotation: ten weeks, two majors on the heels of a minor; every digit frozen into prose during this window went stale
     prompt: Horizontal timeline spanning mid-June to early September 2026 with the four dated release markers from data, the two major versions emphasized over the minor. A bracket over the span labeled with the annotation line. Minimal, dates and versions only.
     BUILD .viz as on-brand HTML per skills/content-gen/references/visual-rendering.md.
     Header: <div class="stbr-eyebrow">..</div> + <h2 class="viz-title">..</h2>.
     Leave the .stbr-decor block untouched (per-asset brand decoration).
     WeasyPrint-safe CSS only: flexbox/grid/borders/gradients; NO box-shadow, NO
     background-image url(), NO JS. Use brand tokens (--surface-*, --text-*, --stbr-*). -->
<div class="stbr-decor" aria-hidden="true">
  <div style="position:absolute;width:533px;height:375px;right:-289px;top:147px;border-radius:53% 51% 53% 62% / 49% 58% 45% 62%;background:#008b4c;opacity:0.5;"></div>
  <div style="position:absolute;width:521px;height:469px;bottom:-277px;left:-277px;border-radius:60% 60% 37% 36% / 38% 39% 46% 60%;background:#306c40;opacity:0.5;"></div>
</div>
<div class="viz">
  <style>
    .v05-card { position: relative; background: var(--surface-card); border-radius: 28px;
                padding: 44px 58px 40px; overflow: hidden; }
    .v05-stage { position: relative; width: 1340px; height: 384px; margin: 22px auto 0; }
    .v05-bracket-label { position: absolute; top: 0; left: 0; width: 1340px; text-align: center;
                         font: 700 21px var(--font-body); color: var(--stbr-dark); }
    .v05-bracket { position: absolute; top: 44px; left: 60px; width: 1220px; height: 26px;
                   border-top: 3px solid var(--stbr-dark); border-left: 3px solid var(--stbr-dark);
                   border-right: 3px solid var(--stbr-dark); border-radius: 12px 12px 0 0; }
    .v05-major { position: absolute; top: 96px; width: 260px; height: 92px;
                 background: var(--stbr-yellow); border-radius: 16px; display: flex;
                 flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
    .v05-major b { font: 900 38px var(--font-display); color: var(--stbr-dark); }
    .v05-major span { font: 700 15px var(--font-body); letter-spacing: .08em;
                      text-transform: uppercase; color: var(--stbr-dark); }
    .v05-minor { position: absolute; top: 282px; width: 280px; height: 88px;
                 background: #FFFFFF; border: 2px solid var(--stbr-green); border-radius: 16px;
                 display: flex; flex-direction: column; align-items: center;
                 justify-content: center; gap: 2px; }
    .v05-minor b { font: 800 26px var(--font-display); color: var(--stbr-dark); }
    .v05-minor span { font: 600 15px var(--font-body); color: var(--text-secondary); }
    .v05-line { position: absolute; width: 2px; background: var(--stbr-dark); }
    .v05-axis { position: absolute; top: 230px; left: 20px; width: 1300px; height: 6px;
                background: var(--stbr-green); border-radius: 3px; }
  </style>
  <div class="v05-card">
    <div class="stbr-eyebrow">KIT RELEASE CADENCE</div>
    <h2 class="viz-title">two kit majors in ten weeks</h2>
    <div class="v05-stage">
      <div class="v05-bracket-label">ten weeks, two majors on the heels of a minor; every digit frozen into prose during this window went stale</div>
      <div class="v05-bracket"></div>

      <!-- majors above the line (the point of the spec) -->
      <div class="v05-major" style="left:148px;"><b>7.0.0</b><span>2026-06-30 &middot; major</span></div>
      <div class="v05-line" style="left:277px; top:188px; height:36px;"></div>
      <div class="v05-major" style="left:962px;"><b>8.0.0</b><span>2026-08-21 &middot; major</span></div>
      <div class="v05-line" style="left:1091px; top:188px; height:36px;"></div>

      <!-- the axis -->
      <div class="v05-axis"></div>
      <div style="position:absolute; left:265px; top:220px; width:26px; height:26px; border-radius:50%;
                  background:var(--stbr-yellow); border:3px solid var(--stbr-dark);"></div>
      <div style="position:absolute; left:1079px; top:220px; width:26px; height:26px; border-radius:50%;
                  background:var(--stbr-yellow); border:3px solid var(--stbr-dark);"></div>
      <div style="position:absolute; left:51px; top:224px; width:18px; height:18px; border-radius:50%;
                  background:var(--stbr-emerald);"></div>
      <div style="position:absolute; left:1271px; top:224px; width:18px; height:18px; border-radius:50%;
                  background:var(--stbr-emerald);"></div>

      <!-- minors below the line -->
      <div class="v05-line" style="left:59px; top:242px; height:40px;"></div>
      <div class="v05-minor" style="left:0;"><b>@solana/kit 6.10.0</b><span>2026-06-16 &middot; a 6.x minor</span></div>
      <div class="v05-line" style="left:1279px; top:242px; height:40px;"></div>
      <div class="v05-minor" style="left:1060px;"><b>latest &rarr; 8.2.0</b><span>2026-09-02 &middot; write-time probe</span></div>
    </div>
  </div>
</div>
</body></html>
