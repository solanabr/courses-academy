id: lesson-rtf-m10-l2
slug: m10-l2
title: "Conclusion: the map you now own"
skills:
  - solana-kit
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: map-check
    type: quiz
    questions:
      - id: m10-l2-q1
        prompt: "Your goal after graduating is writing on-chain programs, and your Rust feels solid after M4, M6. What is the honest reading of the road to the Anchor course?"
        multiSelect: false
        options:
          - id: b
            label: "Your Rust reading level is met; accounts and transactions come from the Bitcoin-to-Solana course, then shipped-program reps"
            correct: true
            feedback: "Two halves to what you lack, and only one of them is a course: the concepts live in the Bitcoin-to-Solana sibling, and the reps nobody hands you. Take the concept course fast, since you over-qualify on its coding floor, then write and ship programs, then read the V2 delta as the delta it is."
          - id: a
            label: "You clear its bar now: Rust fluency is what it wants, and your Rust exit here exceeds reading level"
            correct: false
            feedback: "The reading level IS met here, and it matters. But that course's own sign is a shipping bar: it assumes you already ship Anchor programs and want the V2 delta. Reading fluency is necessary and nowhere near sufficient; the concepts and the shipped-program reps still have to come from somewhere."
          - id: c
            label: "You should take the client-side mastery course first, since Anchor programs always need a TS client for anything a user touches"
            correct: false
            feedback: "Programs do get TS clients, but the client-side course is the wallet-UX and tx-landing route, not an Anchor prerequisite. What you are missing is conceptual (accounts, PDAs, transactions as ideas, the concept sibling's job) plus actual shipped-program practice; the client-side course is neither."
          - id: d
            label: "Start with the digital assets course, since token programs are the gentlest way into on-chain code, and its own labs walk you up to writing programs of your own"
            correct: false
            feedback: "That door has the taller sign, not the gentler one. Its PDA half belongs to the concepts course anyway, and the token-account background its first module leans on is something this course consciously did not supply, so you arrive owing it rather than warmed up."
        explanation: "The exit map's integrity moment: the Anchor course's own sign is blunt, it assumes you already ship Anchor programs and want the V2 delta. This course supplies the Rust reading level with evidence (you write structs, enums, traits, Result, and serde daily); the conceptual grasp of accounts, PDAs, and transactions is the Bitcoin-to-Solana evolution course's job, and the shipping reps are yours to earn between the two. Rust confidence alone does not clear a shipping bar."
      - id: m10-l2-q2
        prompt: "Six months from now you scaffold a fresh Solana TS project, copy this course's install line, and npm fails with a peer-dependency error. What does the course's re-verify habit say to do?"
        multiSelect: false
        options:
          - id: b
            label: "Downgrade your other packages until they match the kit major the course printed in its labs"
            correct: false
            feedback: "Backwards, that treats the course's digit as the fixed point and your ecosystem as the error. The rule pins what your dependencies peer against TODAY, per workspace; the printed major was only ever what deps peered against then."
          - id: d
            label: "Copy your station's kit pin into the new workspace, since that digit installed cleanly there"
            correct: false
            feedback: "The station's pin is right for the station's dependency set, and a fresh scaffold has a different one. Per-workspace is the whole shape of the rule: one repo can legitimately hold two workspaces on different kit majors, because their own dependencies peer differently."
          - id: c
            label: "Re-probe what your deps peer against today and pin that per workspace; the rule outlives the digit"
            correct: true
            feedback: "One npm view of your deps' peerDependencies answers it in ten seconds, and the answer is authoritative on the day you ask rather than the day someone wrote it down. Then stamp the date in your pin table, which is what turns a list of future lies into a maintenance manual."
          - id: a
            label: "Add --legacy-peer-deps and continue: the course's printed install line is the verified canonical setup"
            correct: false
            feedback: "That flag silences the signal instead of reading it. The course's digits were verified at write time and were expected to rot, kit moved two majors in just over nine weeks during research alone. A frozen install line is a snapshot, never canon."
        explanation: "The habit is the deliverable: 'pin what your deps peer against, per workspace' survives every major bump, while any specific digit rots, this course's own research watched kit ship two majors in just over nine weeks and its house rules file go stale twice. One npm view of your deps' peerDependencies tells you today's pin; your pin table makes updating it a one-line edit."
      - id: m10-l2-q3
        prompt: "Deep in a program-authoring lab a few months from now, the borrow checker demands a lifetime annotation beyond anything this course covered. Per the map you now own, what is that moment?"
        multiSelect: false
        options:
          - id: d
            label: "Ceremony to satisfy the compiler: add the widest annotation that compiles and get back to the lab"
            correct: false
            feedback: "The annotation is a claim about which handle is live when, and the compiler is arguing with you about it. Widening it until the error disappears retires the argument without reading it, which is the one habit that turns a bookmark coming due into a bug arriving later."
          - id: c
            label: "A signal you have out-grown your stack: prefer crates and patterns that never surface explicit lifetimes"
            correct: false
            feedback: "Avoidance inverts the lesson. Hitting a lifetime wall at need-time is the 80/20 system WORKING: the deep-dive is bookmarked for precisely this moment, and the wall is rarer than you fear, the Anchor V2 labs strip old lifetime annotations rather than demanding new ones."
          - id: a
            label: "A bookmark coming due: lifetimes were signposted as the 20%, pulled at exactly this need-time"
            correct: true
            feedback: "You are collecting a reserved item, not discovering a hole. The deep treatment was named and dated in the taught-versus-bookmarked table for exactly this moment, and the reason it waited is that reading lifetimes when the compiler prints them carried you for ten modules."
          - id: b
            label: "A gap this course should have closed: go back and re-do the Rust modules before continuing the lab"
            correct: false
            feedback: "Re-doing M4, M6 would not help, lifetimes-beyond-reading were never in them, by explicit design. The 80/20 contract cut the topic and bookmarked the canonical treatment; the fix is opening the bookmark now, not re-treading the taught 80%."
        explanation: "This is the map functioning as designed: the 20% was never missing, you know exactly where it lives (the canonical Rust deep-dives this course bookmarked) and now you know WHEN you need it. The taught-vs-bookmarked table re-sorted by urgency exists so this moment feels like collecting a reserved item, not discovering a hole in your education."
