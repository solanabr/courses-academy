id: lesson-she-validation-sprint
slug: validation-sprint
title: "Evidence in one week, then decide"
skills:
  - solana-fundamentals
  - rpc-reads
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: check
    type: quiz
    questions:
      - id: q1
        prompt: "Your evidence pack's only test is 'show five friends the tab and count who says it sounds good.' Against the first acceptance line, does the pack pass?"
        multiSelect: false
        options:
          - id: a
            label: "No, because no result it can produce would change what you do on Monday, so it is a rehearsal, not a test."
            correct: true
          - id: b
            label: "Yes, because five conversations is the cheapest instrument and the tally gives a scorable result on day 6 of the week."
            correct: false
            feedback: "Conversations are the cheapest instrument only when they can say no. Counting sounds good cannot."
          - id: c
            label: "No, because friends must be swapped for owners, but the instrument and the counting rule are sound."
            correct: false
            feedback: "Friends are one problem, and the counting rule is the other. A tally of sounds good scores as nothing."
        explanation: "A disconfirming test is built so that one of its possible results would make you drop the idea or a claim inside it. A yes fits five worlds at once, including the polite friend, and sounds good is scored as nothing under the day 1 rule. The first acceptance line asks for at least one test whose result was allowed to hit the kill line, and this one has no kill line to hit."
      - id: q2
        prompt: "Fiado's five conversations come back: 2 no with different reasons, 2 conditional yes on the same condition, 1 already on a phone. The kill line is 3 or more no. Predict the decision in the memo."
        multiSelect: false
        options:
          - id: a
            label: "Commit as written, because the kill line was not reached and three of the five were some form of yes on the day."
            correct: false
            feedback: "The assumption survived narrower than written. Committing to the day 0 sentence ignores the shape the yeses named."
          - id: b
            label: "Pivot on shape, because it survived narrower: the owner's phone, and the customer sees the same balance."
            correct: true
          - id: c
            label: "Kill, because two no's with two different reasons show the problem is wider than a phone can fix."
            correct: false
            feedback: "Two no's did not reach the kill line, and two different reasons is the opposite of a shared blocker."
        explanation: "The kill line was not reached, and the two no's split between disputes and older customers, so no single reason blocks the idea. The two conditional yeses named the same shape unprompted, the owner's phone with a balance the customer can see too. That narrowing is the result, so the memo says pivot on shape and commits to the tab, and pitch v1 changes the product half to match."
      - id: q3
        prompt: "Round 1 of feedback comes back: three people, three entries, and none of their comments changed the pitch sentence. Predict what that round is worth."
        multiSelect: false
        options:
          - id: a
            label: "Nothing, because a round that rewrites zero words means the three people were too close to the team."
            correct: false
            feedback: "Fiado's three were a shop owner, a regular and someone who entered a hackathon once. The round is judged on what it revealed, not on edits."
          - id: b
            label: "Little, because the storyteller should keep showing it until at least one claim changes per round."
            correct: false
            feedback: "A round where every comment rewrites the sentence is a sentence that had nothing in it."
          - id: c
            label: "A fine round, because each entry says what the sentence is not carrying and where that thing should live."
            correct: true
        explanation: "Fiado's round 1 changed the sentence zero times and still moved three things: the why-chain answer to the written answers, a note for the build weeks that the customer never sees the word stablecoin, and who pays to the memo as the next Viability assumption. The log is doing its job when it tells you what the sentence is not carrying and where that belongs."
