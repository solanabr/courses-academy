id: lesson-she-rehearsal
slug: rehearsal
title: "Rehearse the season before the season"
skills:
  - solana-fundamentals
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: check
    type: quiz
    questions:
      - id: q1
        prompt: "The record you read in lesson 1 holds Frontier's US$10,000 USDG Superteam Brasil side track, and on 2026-09-06 the World's Fair page is not up yet. A teammate writes US$10,000 on the next-season line. Predict what the plan should hold instead."
        multiSelect: false
        options:
          - id: a
            label: "The US$10,000, since the side track amount held between seasons and a plan needs a number to budget the rehearsal against."
            correct: false
            feedback: "The amount moved from US$11,200 on Cypherpunk to US$10,000 on Frontier, so it is never this season's amount until the page says so."
          - id: b
            label: "The Cypherpunk figure of US$11,200, since the higher of the two known rows is the safer estimate for a budget line."
            correct: false
            feedback: "Cypherpunk came before Frontier, and the point is that the number moves every season, not which old number is bigger."
          - id: c
            label: "A dated slot with no amount, expected September 14, 2026, filled only when earn.superteam.fun carries it."
            correct: true
        explanation: "Quoting last season's side track as this season's is the easy footgun, because the old number is already in your head. The row moved from US$11,200 on Cypherpunk to US$10,000 USDG on Frontier, and as of 2026-09-06 the World's Fair Superteam Brasil side track was only expected on September 14. So the plan holds a dated slot with no amount until earn.superteam.fun carries the row, and the check date is written next to it."
      - id: q2
        prompt: "You decide to enter a seasonal edition as a rehearsal. A teammate says the package is already exported, so nobody needs to open the edition's page until submission day. Predict what the plan does on the day you decide, and why."
        multiSelect: false
        options:
          - id: a
            label: "Opens the page that day and copies its deliverables and its deadline into the plan, then reflows the package you already have into those sections."
            correct: true
          - id: b
            label: "Waits for submission day, since every edition takes the same deck, video and repo and the Colosseum package already covers all three."
            correct: false
            feedback: "Each edition has its own page with its own deliverables and deadline, and an item missing from that page is found on submission day, when there is no time left to reflow."
          - id: c
            label: "Opens the page that day and rebuilds the package around the edition's own criteria, since a rehearsal is scored by its own judges and the deck should match the room it enters."
            correct: false
            feedback: "Rebuilding for a rehearsal's criteria is the footgun the plan refuses. Colosseum's seven factors are the target, and the package is exported and changed once, never rebuilt."
        explanation: "A seasonal hackathon or a side track has its own page with its own deliverables and deadline, and the plan reads that page the day you decide to enter, not the day the form closes. The deadline goes through the same conversion as Colosseum's, and the package you already have reflows into the page's sections with nothing new written. The edition's scores come back as a feedback round that tests how you deliver the seven factors to strangers, and the package changes only where a score points at a factor Colosseum also reads."
      - id: q3
        prompt: "Three Superteam Brasil editions overlap on the calendar and a team of two wants to enter all three before the side track is announced on September 14. Predict what the plan does and what the team would otherwise arrive with."
        multiSelect: false
        options:
          - id: a
            label: "Enters all three, since more rehearsals mean more scores to read, and exports the package once for each edition's form."
            correct: false
            feedback: "A team of two that enters all three rehearses nothing and arrives on September 14 with three half-packages and no scores read."
          - id: b
            label: "Enters the two online editions, since they cost no trip, and skips the in-person one because presence is a test the global portal never runs anyway."
            correct: false
            feedback: "Presence in a room is the one test the Colosseum portal will never give you, which is why the in-person edition is the one to take when someone can travel."
          - id: c
            label: "Names one edition and writes a no with a reason next to the others, since three at once means three half-packages and no scores read."
            correct: true
        explanation: "A rehearsal costs a week of the month and a second set of forms, and three at once costs the month. A team of two that enters all three arrives on September 14 with three half-packages and no scores it had time to read. The plan names one rehearsal, the in-person one when somebody can be in the room, and says no to the rest in writing so the no is already there when the next page looks easy."
