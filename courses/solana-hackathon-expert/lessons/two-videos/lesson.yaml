id: lesson-she-two-videos
slug: two-videos
title: "The two videos"
skills:
  - solana-fundamentals
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: check
    type: quiz
    questions:
      - id: q1
        prompt: "On the exported files your demo runs 3:08 and your presentation runs 1:52. Predict what the portal's limits do to each and what changes before upload."
        multiSelect: false
        options:
          - id: a
            label: "Both are fine, since the limits are guidance and a reviewer watching with the sound off is not timing the demo to the second."
            correct: false
            feedback: "The portal states both limits, the brief assumes they are enforced, and a 3:08 demo is a demo that may never be watched."
          - id: b
            label: "Only the presentation is at risk, since it is the video judges open first, so it grows to two minutes while the demo keeps its eight seconds."
            correct: false
            feedback: "The demo has a hard limit of three minutes and ten seconds of footage was never worth a video that goes unwatched."
          - id: c
            label: "Both miss, since the demo may never be watched and the presentation is under two minutes, so both get re-cut and re-timed on the export."
            correct: true
        explanation: "The presentation video is two to three minutes and the demo is no more than three minutes, both as the portal prints them. A 3:08 demo is over the limit and may never be watched, and a 1:52 presentation is under the window the script was built to land in. The length is checked on the exported file and not the recorder's counter, since exports pick up seconds at the edges, and the last logged length is the one the capstone copies."
      - id: q2
        prompt: "You stop the presentation at 0:20 for three viewers and two of them say: small shops extend credit informally. Predict what round 4 does with the first twenty seconds."
        multiSelect: false
        options:
          - id: a
            label: "Rewrites them around one person and re-records the same day, and the new entries go into round 4 with their export lengths."
            correct: true
          - id: b
            label: "Passes them, since both viewers named the problem correctly, and the round moves on to the demo question about what confirmed."
            correct: false
            feedback: "Two of three describing the category instead of a person is the rule's trigger for a rewrite and a re-record the same day."
          - id: c
            label: "Grows them to forty seconds so the story has room to land, using the full problem-slide note as written."
            correct: false
            feedback: "The slot is the problem-slide note cut down, not read as written, and only the timer decides how many words fit in twenty seconds."
        explanation: "The bar for the first question is that the viewer says something close to that happened to me, or names someone it happened to. If two of the three describe the category instead of a person, the twenty seconds are rewritten and re-recorded the same day, and the round keeps its number and gets more than three entries. Every entry carries the export length of the file that viewer watched, because a re-record changes it."
      - id: q3
        prompt: "Your shot list has you saying: and the cooperative rollout comes next, over shot 5 while the transfer confirms. Predict what a judge watching with the sound off sees and what the rule says."
        multiSelect: false
        options:
          - id: a
            label: "The same demo, since the captions carry the sentence and the confirmation is on the screen either way for anyone watching."
            correct: false
            feedback: "Captions of a claim the screen cannot back are still a claim the screen cannot back, and the demo only shows what it does."
          - id: b
            label: "A video that never showed the thing it claims, so shot 5 stays silent and the rollout goes back to the next-steps slide."
            correct: true
          - id: c
            label: "A stronger demo, since a silent confirmation wastes twenty seconds a judge could spend hearing where the product goes next."
            correct: false
            feedback: "A judge who builds reads a confirming transaction faster than you can describe it, and the two silent shots, 4 and 5, are the ones that matter."
        explanation: "If it is not on the screen at that second, do not say it. A demo video that narrates a feature while the screen shows something else is a demo of your voice, and a judge watching with the sound off sees a video that never showed the thing it claims. The rollout, the tab program and the fiat rails belong on the next-steps slide and in the presentation video, and shot 5, silent on the shot list like shot 4 before it, lets the confirmation land."
