id: lesson-she-ideation
slug: ideation
title: "Problems you actually have"
skills:
  - solana-fundamentals
  - rpc-reads
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: check
    type: quiz
    questions:
      - id: q1
        prompt: "You run idea-sprint on a third candidate taken from next door: the bakery's paper stamp card as a token a regular holds in a wallet. Predict the gate answer and the call."
        multiSelect: false
        options:
          - id: a
            label: "Passes the gate because tokens are a shared record, and lands as a conditional until a bakery agrees to pilot it."
            correct: false
            feedback: "The stamp card is already a record both parties can see, so nothing breaks without a chain."
          - id: b
            label: "Fails the gate because a paper stamp card is already a record both parties can see, and lands as a no-go."
            correct: true
          - id: c
            label: "Fails the gate because the bakery is not the interviewed shop, and lands as a conditional pending a second interview."
            correct: false
            feedback: "Where a candidate came from does not decide the gate. The gate asks what breaks with a database and a web app."
        explanation: "The crypto-necessity gate asks one question of every candidate: built with a database and a web app, what breaks? The stamp card is already a record both the bakery and the regular can see, so nothing breaks, and on the worked example it scores 3 of 15 for a no-go. Stealing from next door is still worth doing every time, because one outside candidate keeps the other two honest."
      - id: q2
        prompt: "Your favorite idea scores 7 of 15 and the skill writes conditional with no condition named. Predict what that call is worth, and the next move."
        multiSelect: false
        options:
          - id: a
            label: "A conditional with no condition is a polite no, so you ask the skill to name the thing that would move it."
            correct: true
          - id: b
            label: "A 7 is one point short of a go, so you re-run the interview with tighter answers until the number crosses 8."
            correct: false
            feedback: "Re-running the interview until the number you wanted appears is the same as not scoring at all."
          - id: c
            label: "A conditional means build it and validate in week 2, so you mark it chosen and write the gap note afterwards."
            correct: false
            feedback: "A chosen candidate below 8 does not meet the bar, and the gap note is written for all three before choosing."
        explanation: "At 6 to 7 the call is conditional, and a conditional is a candidate that could become a go if one named thing changed. The skill should name the thing, and if it does not you ask it to, because a conditional with no condition is just a polite no. The week that follows, market research and validation, is where a named condition gets met or not."
      - id: q3
        prompt: "The tab scored 11. You search the record with Copilot and find a finished project from last season that already does everything the tab does. Predict what happens to the memo."
        multiSelect: false
        options:
          - id: a
            label: "The score stands at 11, because the sprint scored the interview and the record only changes the pitch's wording."
            correct: false
            feedback: "A candidate with no gap is a clone of something the judges have already scored once, and the row has to say so."
          - id: b
            label: "The tab drops to a conditional, and the gap note names the past project as the first row of the market map."
            correct: false
            feedback: "The competitor map is next lesson. Today the gap note has to record that there is no gap, dated."
          - id: c
            label: "The row is no longer at 11, and the memo says so with the date, because a candidate with no gap is a clone."
            correct: true
        explanation: "Gap analysis finds the nearest past projects and writes down what they did not do, and the gap is where your candidate lives. If the nearest project already does everything the tab does, the candidate is a clone of an idea the judges scored once, and the row changes with the date next to it. That is why the search runs on all three candidates before one is chosen: the record can reorder them, and it does."
