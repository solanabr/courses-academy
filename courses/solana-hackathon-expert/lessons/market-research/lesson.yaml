id: lesson-she-market-research
slug: market-research
title: "Sizing at hackathon speed"
skills:
  - solana-fundamentals
  - rpc-reads
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: check
    type: quiz
    questions:
      - id: q1
        prompt: "Row five of your map is an on-chain merchant tool. The explorer page shows a large all-time transaction count and a most recent transaction six weeks old. What goes in the last-activity cell, and what does it say?"
        multiSelect: false
        options:
          - id: a
            label: "The project's latest funding announcement, dated, because it is the freshest signal that the product is alive."
            correct: false
            feedback: "An announcement is the competitor's marketing. If it is all you can find, the cell reads announcement only, dated, never activity."
          - id: b
            label: "The all-time count only, because it proves a large user base and the last transaction is noise on a busy program."
            correct: false
            feedback: "The time of the last transaction is the signal. A big count with an old last transaction says users came and left."
          - id: c
            label: "All three explorer values with the date read, and it reads as a product that had users and lost them."
            correct: true
        explanation: "The on-chain read copies the all-time count, the last thirty days where shown, and the time of the most recent transaction, each with the URL and the date. A large all-time count with a last transaction weeks ago is a product that had users and lost them, and that is a useful row. What the project's own site says about itself never goes in the activity column."
      - id: q2
        prompt: "Fiado's SOM line reads '12 percent of SAM by month three.' Against the acceptance bar, does it pass, and why?"
        multiSelect: false
        options:
          - id: a
            label: "It fails, because SOM must name a channel with a member count and a page, and nobody can reach a percentage."
            correct: true
          - id: b
            label: "It passes, because SOM is by definition a share of SAM and the arithmetic behind that share is shown for the judge."
            correct: false
            feedback: "A share of SAM in the SOM line fails the bar no matter how reasonable the share looks."
          - id: c
            label: "It fails, because 12 percent is far too optimistic for a month-three number and the share should be revised downward."
            correct: false
            feedback: "The problem is not the size of the share. Any share fails, because a share cannot be reached by a person with a phone."
        explanation: "SOM is the part of the market you can reach in the first months through a channel you can name. A cooperative with a member list can be reached by a person with a phone, and a percentage cannot. The line the judge wants is N shops, reachable through a named association with its page and date, by month three, because of a named introduction."
      - id: q3
        prompt: "A stablecoin's explorer page shows a holder count for the region. A teammate copies it into input D as 'customers who can already pay in a stablecoin.' Predict the judge's read."
        multiSelect: false
        options:
          - id: a
            label: "Accepted as a count from a public page, because the explorer is a source the judge can click."
            correct: false
            feedback: "Clickable is necessary but not enough. The judge will ask what a holder count is allowed to prove."
          - id: b
            label: "Challenged, because a wallet is not a user, so it goes in as an upper bound on people with the date."
            correct: true
          - id: c
            label: "Rejected, because on-chain reads are not market evidence and D needs the issuer's published figure."
            correct: false
            feedback: "On-chain reads are market evidence. The issuer's figure goes in too, marked, because the two will not agree."
        explanation: "One person owns several wallets and a bot owns thousands, so an address count is an upper bound on people and the file writes it down that way. The holder count and the last thirty days of transfers both go in with the date, and if the issuer publishes a regional number it goes in as well with its page marked, because the judge may ask which one you trust."
