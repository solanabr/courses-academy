id: lesson-she-gtm
slug: gtm
title: "Where the first hundred come from"
skills:
  - solana-fundamentals
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: check
    type: quiz
    questions:
      - id: q1
        prompt: "Your why-Solana paragraph opens with a throughput figure and reads the same with any other track's name swapped in. Predict how the track judge and the accelerator each take it, and what replaces it."
        multiSelect: false
        options:
          - id: a
            label: "Neither is satisfied, so it is rewritten around the thing the slice does and the mechanism on Solana it uses, with the integration named in one line."
            correct: true
          - id: b
            label: "The track judge accepts it and the accelerator does not, so a second paragraph goes underneath naming the Solana integration in one line for the accelerator."
            correct: false
            feedback: "A judge on the Solana track has read that paragraph from every other entry that morning, and a number about the chain has no slice in it."
          - id: c
            label: "Both accept it, since the track judge wants the chain's strengths stated and the accelerator only checks that Solana integration is named somewhere."
            correct: false
            feedback: "The track judge wants a mechanism the slice uses, and this course names no benchmark for the same reason."
        explanation: "The track judge has seen the same category of project argued for every ecosystem that season and wants a mechanism: the thing the slice does and the thing on the chain it does it with. The accelerator requires some form of Solana integration and wants it named in one line, and the settlement with the transaction from the narrative log is that line. A benchmark is a claim about the chain, your slice is not in it, and the next-track-over test is what the rewritten paragraph has to survive."
      - id: q2
        prompt: "Fiado has one shop on the tab and no revenue. A teammate adds a three-tier pricing table to the one-pager. Predict how a judge reading for Viability takes it and what the honest line is."
        multiSelect: false
        options:
          - id: a
            label: "As a strong Viability answer, since a tiered table is what the factor asks for and the drawn money flow is optional once a price exists."
            correct: false
            feedback: "A pricing slide for a product with no users is a slide about nothing, however many tiers it has, and the drawn money flow is what makes the line read as a decision."
          - id: b
            label: "As a slide about nothing, since the product has no users, so the line becomes none yet, the reason, and who would pay first."
            correct: true
          - id: c
            label: "As a mild negative that a bigger market number on the problem slide offsets, so the table stays with a note that the prices are indicative."
            correct: false
            feedback: "A pricing slide for a product with no users is a slide about nothing, and no market number makes it about something."
        explanation: "A pricing slide for a product with no users is a slide about nothing. The honest line has three parts: none yet, the reason, and who would pay first, which for Fiado is the shop, since the shop is the one that loses the notebook, and not before ten shops have run a tab for a month. Written at the end of a drawn money flow that line reads as a decision made with open eyes, and the same words with no flow read as a team that never thought about it."
      - id: q3
        prompt: "The wallet replied on 2026-10-07: not before the end of the year, interesting, but the roadmap is fixed. A teammate wants its logo on the partner slide. Predict where the row goes and what a judge gets in the interview."
        multiSelect: false
        options:
          - id: a
            label: "On the deck as a logo, since any reply is a conversation and a judge picking names off the slide at random is unlikely to pick that one."
            correct: false
            feedback: "The judge picks a name at random, and a logo you cannot back is worse than an empty slide because it tells the judge something about the team."
          - id: b
            label: "Off the list entirely, since a no is not evidence and the deck should carry only the projects that agreed to something."
            correct: false
            feedback: "A logged no is evidence that you asked, learned the reason, and know what has to change, and it stays in the file."
          - id: c
            label: "In the notes as asked, declined, the reason and the date, so a judge who asks about wallets gets a true answer instead of a logo."
            correct: true
        explanation: "The yes goes on the deck as a sentence with the project named and what was agreed, and the no stays off the deck as a logo and goes into the notes as asked, declined, the reason and the date. In the 15-minute interview a judge picks a name off the partner slide and asks about it, and a true answer with a date on it is worth more than a logo the judge can poke through. One real reply beats five logos, and a logged no is still a reply."
