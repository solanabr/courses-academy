id: lesson-she-day-zero
slug: day-zero
title: "The team on day 0"
skills:
  - solana-fundamentals
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: check
    type: quiz
    questions:
      - id: q1
        prompt: "Ana is Fiado's only builder and also its partnerships owner. The card names both roles but says nothing about which weeks partnerships will slip. Predict where the judging criteria find the gap."
        multiSelect: false
        options:
          - id: a
            label: "Under Product + Execution in weeks 2 and 3, because the builder's hours were split across the partner calls."
            correct: false
            feedback: "In practice the build wins those weeks and the partner calls do not happen, so the slice is fine and the partner list is not."
          - id: b
            label: "Under Founder + Market Fit, because a doubled role tells the judges this team lacks the skills to carry it."
            correct: false
            feedback: "Doubling is normal on a two-person team. The judges find the missing output, not the doubled role."
          - id: c
            label: "In the week 4 GTM one-pager, which has no partner names because nobody dated the calls around the build."
            correct: true
        explanation: "A doubled role is underserved in the weeks its owner's other job takes, and the builder's building weeks are weeks 2 and 3, so partner conversations will not happen then whatever the card says. Fiado's card says so first and dates the calls into week 1 and the start of week 4. A card that stays quiet produces a GTM one-pager with partners described and not named, and that is visible from across the room."
      - id: q2
        prompt: "You ran the date command with 2026-09-14 and put the five printed dates on the five phases. A week later the live page prints a different opening date. What do you do to the plan?"
        multiSelect: false
        options:
          - id: a
            label: "Keep the phase dates, since the deadline is what matters, and only re-read the hour on the brief."
            correct: false
            feedback: "The phases were derived from the opening date, so a moved opening moves every boundary under it."
          - id: b
            label: "Change the one date inside the command, re-run it, and let the five phases move together."
            correct: true
          - id: c
            label: "Retype each phase boundary by hand from the new page, since a shifted season breaks the arithmetic."
            correct: false
            feedback: "The arithmetic is start plus seven days per phase. That is exactly why it is derived and not typed."
        explanation: "The plan is derived from one date so that a change on the live page costs one edit. Change the date inside the command, run it again, and the five phases move with it. The deadline hour still lives on the brief and the plan points at it, so there is only one place for each number to be wrong."
      - id: q3
        prompt: "Bruno sends pitch v0 to three people and logs 'cool, I like it' from all three, dated. Against the acceptance bar, is the piece done, and what should the entries hold?"
        multiSelect: false
        options:
          - id: a
            label: "Not done: an entry holds what the person did not get, in their words, so he asks each what the sentence says."
            correct: true
          - id: b
            label: "Done: three named entries dated this week meet the bar, and what they did not get comes later in round 1 of week 1."
            correct: false
            feedback: "A reply of cool is not a log entry. The bar asks for three entries holding what each person did not get."
          - id: c
            label: "Not done: the three must be shop owners with the problem, so he replaces two of them and logs again."
            correct: false
            feedback: "Fiado's three sit at different distances from the problem on purpose, including one who has never run a tab."
        explanation: "A feedback log records, in the person's own words, the part of the sentence they did not understand. What they liked goes nowhere, because a compliment does not say which claim is missing. The fix is to ask each person what the sentence is about and write down what they say back. Fiado's three names are the shop owner, a regular and a stranger to shop tabs, three distances the sentence has to survive."
