id: lesson-she-read-the-rubric
slug: read-the-rubric
title: "What winning means at Colosseum"
skills:
  - solana-fundamentals
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: check
    type: quiz
    questions:
      - id: q1
        prompt: "Your team spent week 2 refactoring the slice into clean, idiomatic code. You open the repo review section on colosseum.com/hackathon, read 2026-09-06, and check what it looks for. Predict how that week scores."
        multiSelect: false
        options:
          - id: a
            label: "It scores nothing on its own, because the review names code quality as something it is not looking at."
            correct: true
          - id: b
            label: "It scores under Product + Execution, because the review checks whether the patterns fit the team's framework."
            correct: false
            feedback: "The review explicitly says it is not looking at language, framework, patterns or code quality."
          - id: c
            label: "It scores under Insight, because a clean architecture is the technical insight the review is built to find."
            correct: false
            feedback: "Insight asks for a unique insight into the problem or a new trend, not for architecture."
        explanation: "Colosseum's repo review wants significant work during the hackathon window, by the team rather than a third party, with features prioritized strategically. It says in its own words that language, framework, patterns and code quality are not what it is looking at. A refactoring week moves none of the seven lines on its own, and the time comes out of the slice, the video and the written answers that do."
      - id: q2
        prompt: "A teammate's brief lists the seventh factor as Business Model and says judges open the repository first. You check colosseum.com/hackathon as of the 2026 World's Fair season. What is wrong, and what is right?"
        multiSelect: false
        options:
          - id: a
            label: "Both are right: the page still uses that name, and the repo review happens before any video gets watched."
            correct: false
            feedback: "The live word is Viability, and the page names the presentation video as one of the first resources judges review."
          - id: b
            label: "The name is right but the order is wrong: judges read the written answers first, then open the repository after."
            correct: false
            feedback: "The factor is named Viability on the live page, and the page says the presentation video is opened early, not the written answers."
          - id: c
            label: "Both are wrong: the live word is Viability, and the presentation video is among the first things judges review."
            correct: true
        explanation: "The seven factors as read on 2026-09-06 end with Viability and Traction, and a brief carrying another word in that slot is quoting a different season. The same page says the two to three minute presentation video is one of the first resources judges review. Both facts come from the page, not from memory, which is why the brief quotes the page with a date."
      - id: q3
        prompt: "Fiado's brief writes its Traction line as a target: one shop on the tab before the deadline. Which of the four questions does that line answer, and how?"
        multiSelect: false
        options:
          - id: a
            label: "Does the story land, with argument: a shop owner opening the video is the founders communicating the vision."
            correct: false
            feedback: "Founder Communication is the story question. Traction is scored on use, not on the telling."
          - id: b
            label: "Is the problem real and does it work, with evidence: someone already uses it and it holds up."
            correct: true
          - id: c
            label: "Can this team carry it, with proof: work done inside the window by the team rather than a third party."
            correct: false
            feedback: "That is what the repo review checks under the team question. A shop using the tab says nothing about who wrote the code."
        explanation: "Traction does not fit one box because it is not a new question. It is the first two questions answered with evidence instead of argument: people already use it, so the problem is real, and it holds up, so the thing works. A startup competition adds Viability and Traction to the list a code contest would carry, which is why Fiado writes Traction as a target and not as a claim."
