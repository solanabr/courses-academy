id: lesson-she-rederive-winning
slug: rederive-winning
title: "Re-derive winning for a Colosseum season you have never seen"
skills:
  - solana-fundamentals
  - rpc-reads
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: check
    type: quiz
    questions:
      - id: q1
        prompt: "Reading Frontier cold, you see six track firsts at US$25,000 on Cypherpunk became twenty teams at US$10,000 on Frontier. A teammate says the factors must have changed too. Where does that go in the brief?"
        multiSelect: false
        options:
          - id: a
            label: "In the changed column, because a new prize shape means Colosseum reweighted what the judges score."
            correct: false
            feedback: "Prizes and factors are separate lines on separate pages. A changed prize shape says nothing about the factors."
          - id: b
            label: "Nowhere yet, because you check the factors line on the page separately before writing either column."
            correct: true
          - id: c
            label: "In the unchanged column, because prizes never affect factors and the check is a waste of the clock."
            correct: false
            feedback: "The factors have held across three seasons, but they go in the unchanged column only after you read the line itself."
        explanation: "The footgun that catches good teams is assuming the factors changed because the prizes did. Each line is checked separately, against the page, every season. Across Frontier, Cypherpunk and World's Fair the seven factors, the portal field list and the 15-minute interview read the same on colosseum.com/hackathon, and you know that only because you looked at the line and not at the prizes next to it."
      - id: q2
        prompt: "Your Cypherpunk cold read copies the disqualifiers: the team leader must complete the submission before the deadline. Your team card from day 0 names no leader. Predict the consequence and the fix."
        multiSelect: false
        options:
          - id: a
            label: "No consequence, because Colosseum assigns the leader to whoever creates the team in the portal first."
            correct: false
            feedback: "The page says the team leader completes the submission before the deadline. Nobody assigns that role for you."
          - id: b
            label: "The submission is late by default, so you fix it by having every member submit the package separately."
            correct: false
            feedback: "One product submission per team is the rule, and separate submissions by members would break it."
          - id: c
            label: "Not a submission unless the leader completes it, so you name one now on the card and on the brief."
            correct: true
        explanation: "The team leader is the one who must complete the submission before the deadline. A team that discovers on the last day that it has no leader is the team that is awake at two in the morning. The name goes next to exactly one person on the team card and onto the disqualify block of the brief, and Fiado gives it to Bruno so the person completing the form is not the person deploying."
      - id: q3
        prompt: "Rescoring 'a real problem' against Frontier, you open your own files. The idea memo's chosen row starts with the product, and the sizing's TAM is a single figure with no inputs. Predict the score a judge could give that line."
        multiSelect: false
        options:
          - id: a
            label: "Low, because the person is missing from the row and the TAM cannot be rebuilt from sources a judge can click."
            correct: true
          - id: b
            label: "Middling, because the TAM figure carries Potential Market Size and the product line carries Insight on its own."
            correct: false
            feedback: "A TAM with no inputs answers one third of one factor, and a product-first row has no person for Insight to be about."
          - id: c
            label: "High, because a big TAM answers the size question and the product row shows the chain feature that is the insight."
            correct: false
            feedback: "The seven factors do not score technology for its own sake, and a report said is the answer that ends the conversation."
        explanation: "A real problem lands on Insight, Founder + Market Fit and Potential Market Size. The chosen row's first line has to be a person and a problem, the same rule as pitch v0, and the sizing rule is no number without its inputs and no input without a URL and a date. Fiado scores a 7 here because five dated conversations with owners who keep the notebook carry both factors. A product-first row and an unsourced TAM carry neither. The same honesty runs the other way in week 1: a 3 on 'it works' and a near-zero Traction stay low and say so, because those numbers are there to move once something is built."
      - id: q4
        prompt: "Rescoring against the portal page's line that the review wants to understand how the opportunity was uncovered, you open your decision memo. The decision says commit, the five conversations are listed, and the 'would have killed it' line is empty. Predict what a judge reads there and what the file does next."
        multiSelect: false
        options:
          - id: a
            label: "A diary that was always going to commit, so the kill line is written from the day-1 test block before the score is filed."
            correct: true
          - id: b
            label: "Evidence enough on its own, so the line stays empty and 'a real problem' is scored on the five conversations alone, since the evidence is the evidence."
            correct: false
            feedback: "Five conversations are evidence for the problem. The line the page asks about is how the opportunity was uncovered, and an empty kill line says the test could only have said yes."
          - id: c
            label: "A memo missing one formality, so the kill line is filled in from the result you got, which shows the test was passed."
            correct: false
            feedback: "A kill line written after the result is not a kill line. It has to come from the test block written on day 1, before anyone talked to anyone, or the memo cannot say why the result did not reach it."
        explanation: "The fourth line of the memo, what would have killed the idea and why it did not, is what turns a commit into a decision rather than a diary entry, and it is the line Colosseum's page is asking for when it says the review wants to understand how the opportunity was uncovered and how the team prioritizes. Fiado's reads three or more no, or two no with the same reason, and the no's split. That line comes from the day-1 test block, so the fix is to copy the kill line from the block, write why the tally did not reach it, and only then file the score for 'a real problem'."
