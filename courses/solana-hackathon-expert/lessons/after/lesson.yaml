id: lesson-she-after
slug: after
title: "After the deadline"
skills:
  - solana-fundamentals
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: check
    type: quiz
    questions:
      - id: q1
        prompt: "The announcement names your team a winner and a teammate writes: US$250,000 secured, on the next-season plan. Predict what the two pages actually guarantee and what the line becomes."
        multiSelect: false
        options:
          - id: a
            label: "The cheque, since winners are the accelerator subset and the Accelerator invests US$250,000 in each one over eight weeks."
            correct: false
            feedback: "A win guarantees an interview for the Accelerator and not admission, and the investment comes after a second decision."
          - id: b
            label: "An interview for the Accelerator, not admission, with the investment after a second decision, so the plan carries two lines."
            correct: true
          - id: c
            label: "Admission to the Accelerator with the investment held until Demo Day, so the line is right and only early by eight weeks."
            correct: false
            feedback: "Winners are not admitted by winning, and the pages also say winners are not required to join."
        explanation: "Hackathon winners are guaranteed an interview for the Accelerator, not admission, and winners are not required to join. The Accelerator invests US$250,000 per accepted startup over eight weeks, and accepted is a second decision you are not in the room for. So the plan carries the interview and the investment on separate lines with their dates, and nobody on the team collapses them into one."
      - id: q2
        prompt: "Fiado applies for a Solana Foundation milestone grant with the tab as written, including its who-pays line. Predict what the guidelines do with it and which door fits."
        multiSelect: false
        options:
          - id: a
            label: "It passes on Only Possible on Solana, since the settlement is a stablecoin transfer, and the answer arrives in about a week."
            correct: false
            feedback: "Public Good and Open Source are the first two guidelines and they decide the door before the other two are read."
          - id: b
            label: "It is turned back on Open Source, so the fix is publishing the repo and applying again through the same milestone door."
            correct: false
            feedback: "The tab has a Viability answer, so it is not a public good in the milestone sense however open the repo is."
          - id: c
            label: "A no that spends the Foundation's week and yours, since a commercial product goes through the convertible door instead."
            correct: true
        explanation: "Milestone grants are for public goods, and a stablecoin tab for corner shops has a Viability answer, which means it is not a public good in that sense. The page points that shape at convertible grants, for public goods with a commercial component. Fiado's line reads convertible, with the open-source tab and reminder modules as the public-good part, and review takes about one week with a decision about three weeks later."
      - id: q3
        prompt: "Fiado does not place. The team plans to enter the same repo with a new README into Eternal's November window, having raised no venture capital. Predict what the page's rule says and what would qualify."
        multiSelect: false
        options:
          - id: a
            label: "It qualifies, since no venture capital was raised and the November window is open to any prior hackathon product that enters a sprint."
            correct: false
            feedback: "Prior hackathon products are allowed only if materially changed, and a new README is not a change a reviewer can see."
          - id: b
            label: "It does not qualify as materially changed, so the plan documents a real change first, like one real shop settling on the tab."
            correct: true
          - id: c
            label: "It qualifies only in the June window, since the November window is held for products that have never entered a hackathon."
            correct: false
            feedback: "Both windows take self-started sprints under the same rules, and the page prints no such split."
        explanation: "Eternal admits prior hackathon products only if materially changed, and a startup that raised venture capital is ineligible for the Eternal Award, though not for entering a sprint. The page prints no threshold, so the honest reading is that the same repo with a new README does not qualify and the same idea with the tab settling for a real shop and a rewritten reminder probably does. Write down what changed in the plan before the sprint starts, so the material change is documented and not argued about after."
