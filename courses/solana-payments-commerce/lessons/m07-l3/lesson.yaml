id: lesson-spc-m07-l3
slug: m07-l3
title: "MPP, AP2, ACP: the standards war (and gating the API with pay)"
versionStamp:
  checkedAt: "2026-09-07"
  packages:
    "@solana/pay": "1.0.26"
skills:
  - x402-protocol
  - api-monetization
  - payment-model-selection
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: check-standards
    type: quiz
    questions:
      - id: q9-mor
        prompt: "A merchant asks which agentic-payment standard keeps them as merchant-of-record, the same role they hold with a card processor today. Which answer is accurate?"
        multiSelect: false
        options:
          - id: d
            label: "x402, since the facilitator that settles each call takes the merchant-of-record seat."
            correct: false
            feedback: "A facilitator is a settlement intermediary, not a seller. Under x402 you are selling directly to the agent and the facilitator's power is over whether a transaction gets submitted, which is a censorship surface rather than a change of counterparty. Confusing the two is the same blur the fiat seam map refused."
          - id: a
            label: "MPP, because a Solana-native draft always leaves the merchant as merchant-of-record by design."
            correct: false
            feedback: "MPP is a payment-authentication draft; 'merchant-of-record' is not its framing, and being Solana-native says nothing about who bears that role. The standard that explicitly keeps the merchant as merchant-of-record is ACP."
          - id: b
            label: "AP2, because Google and the FIDO Alliance take on merchant-of-record for every AP2 payment."
            correct: false
            feedback: "AP2 is cards-first with verifiable credentials and mandates; it does not make Google the merchant-of-record. ACP is the one that explicitly leaves the merchant as merchant-of-record."
          - id: c
            label: "ACP (Stripe and OpenAI), which is explicitly designed so the merchant stays merchant-of-record."
            correct: true
            feedback: "Its shared-token design keeps the charge on the merchant's own processor: that role is a liability as much as a status, since disputes and tax come with it."
        explanation: "ACP, the Stripe-and-OpenAI Agentic Commerce Protocol, is built around the merchant staying merchant-of-record with a Shared Payment Token. That framing, familiar from card rails, is a real differentiator when you place the four standards, and it is exactly the lens the course uses at every payment seam."
      - id: q10-mpp-dated
        prompt: "You want to document Wavelength's MPP support. What is the honest way to state the standard's status, given draft-solana-charge-00?"
        multiSelect: false
        options:
          - id: a
            label: "Two documents, two standings: draft-solana-charge-00 is a method spec registered under draft-httpauth-payment-00, the IETF draft expiring 2026-12-21."
            correct: true
            feedback: "The registration and the real expiry belong to the base scheme; the method spec only defines solana/charge underneath it, and documenting one layer's status as the other's promises stability neither offers."
          - id: d
            label: "Two documents, with the datatracker registration on draft-solana-charge-00, and the base scheme dated from its commit history."
            correct: false
            feedback: "The layers are the right frame and they are the wrong way up. Searching the datatracker for draft-solana- returns zero documents: the base scheme is the one on the IETF's clock, and the Solana method spec is the one you date from its git history."
          - id: b
            label: "One dated Internet-Draft snapshot, quoting the publication and expiry dates printed at the top of draft-solana-charge-00's rendered spec page."
            correct: false
            feedback: "Those dates are generated by the spec site's build rather than registered anywhere, and they move on every rebuild; the datatracker returns zero documents for draft-solana-, and commits are what you quote."
          - id: c
            label: "A ratified Solana Foundation standard, since the Foundation wrote it and ships client tooling against it, so apps and docs can depend on it long-term."
            correct: false
            feedback: "Nothing here is ratified; the base scheme is an Internet-Draft with an expiry and the method spec has no standards-body status at all. Foundation authorship says who maintains one method."
        explanation: "MPP is two layers. draft-httpauth-payment-00, the 'Payment' HTTP authentication scheme from Tempo Labs and Stripe, is the document with an IETF registration and a genuine expiry. draft-solana-charge-00 is a payment-method spec registered under it, authored at the Solana Foundation, sitting in specs/methods/ beside tempo/charge and stripe/charge, and never submitted to the datatracker at all. Honest documentation names both layers and dates the Solana half from its commit log, never from the expiry its rendered page prints."
      - id: q11-pay-gate
        prompt: "You ran `pay gate api paywall.yml` on the pressing-price API, then `pay curl` completed a paid call. What did gating with the CLI actually buy you versus hand-writing an x402 middleware and an MPP handler yourself?"
        multiSelect: false
        options:
          - id: d
            label: "One gate answers both protocols, and its pooled accounting writes each settled call into the backoffice ledger under its own invoice id."
            correct: false
            feedback: "The first half is what you bought; the second half is the seam the lesson leaves open on purpose. There is no memo field in paywall.yml and the gate's pooled accounting hands back no per-call id, so gate-routed sales appear on the explorer and in your transcript, never in orders.jsonl. Middleware-routed sales still reconcile, because you wired that hook yourself."
          - id: b
            label: "One gate makes the same API answer both x402 and MPP, and `pay curl` negotiates whichever the caller speaks."
            correct: true
            feedback: "Emitting both challenges moves the protocol choice to the caller, which is the optionality you buy; the price is a churn-prone CLI sitting in the request path."
          - id: a
            label: "Nothing structural; `pay gate` only emits the x402 402 challenge, so an MPP caller still needs the WWW-Authenticate: Payment handler you write yourself."
            correct: false
            feedback: "One gate makes the SAME API answer both, WWW-Authenticate: Payment challenge included. If it only served x402, gating would not be worth the CLI dependency."
          - id: c
            label: "It moves settlement fully on-chain, so neither the x402 facilitator nor MPP's co-signing server sits in the payment path any more."
            correct: false
            feedback: "Gating does not remove the facilitator/co-signer role; x402 still settles through a facilitator and MPP's pull mode still has the server co-sign. What gating buys is one API serving both protocols, not the elimination of that role."
        explanation: "`pay gate api paywall.yml` lets one API answer both x402 and MPP, and `pay curl` auto-negotiates the 402 on whichever protocol the caller speaks. That is the hands-on payoff: instead of betting on a single standard in a fast-moving field, you gate once and let the CLI negotiate, accepting a churn-prone CLI dependency as the cost."
      - id: q12-bet
        prompt: "An integrator asks for your honest 2026 recommendation on which single agentic-payment standard to build on exclusively. What is the defensible answer this lesson lands on?"
        multiSelect: false
        options:
          - id: a
            label: "Commit fully to AP2 now; Google plus FIDO backing, and a mandate model that already covers agent authorization, makes it the safe single bet."
            correct: false
            feedback: "No standard is guaranteed to win, and AP2 is cards-first, a poor fit for Solana-native metered APIs. Picking one exclusively is the premature bet the lesson argues against."
          - id: d
            label: "Do not bet yet and do not gate either: wait until one standard wins, then integrate that one."
            correct: false
            feedback: "This is the 1949 record buyer's move, and it is the one the story singles out as the loser: the buyers who waited out the speed war bought nothing while the turntable makers who shipped multi-speed players sold through it. Waiting is not neutral here, it is declining every agent that knocks in the meantime."
          - id: b
            label: "Commit fully to MPP now; the Solana Foundation authored the draft, and pull-mode fee sponsorship already covers the Solana-native case end to end."
            correct: false
            feedback: "Fee sponsorship is not unique to MPP, since x402's facilitator plays the same role; and the Foundation authored only the method spec, while the base scheme it plugs into is a Tempo Labs and Stripe draft."
          - id: c
            label: "Do not bet exclusively yet; gate once (with the pay CLI, say) and negotiate, since the field is unsettled."
            correct: true
            feedback: "When adoption is undecided, the cheap move is the reversible one; deferring isn't free, though, since you now carry two protocols' semantics."
        explanation: "The lesson's honest 2026 position is that the standards war is unsettled: x402 has traffic but a facilitator trust boundary, MPP is a Solana method spec riding a base draft that expires, and AP2/ACP are cards-first with different merchant-of-record models. Gating once and negotiating (the `pay gate` beat) beats an exclusive early bet, at the cost of a CLI dependency."
