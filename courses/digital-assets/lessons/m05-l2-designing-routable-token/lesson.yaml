id: lesson-date-m05-l2-designing-routable-token
slug: m05-l2-designing-routable-token
title: "Designing a routable, compliant token"
skills:
  - token-2022
  - program-security
  - account-model
  - version-pinning
versionStamp:
  checkedAt: "2026-09-05"
  packages:
    tsx: "4.23.12"
    typescript: "5.9.3"
blocks:
  - key: intro
    type: prose
    src: intro.md
  - key: check
    type: quiz
    questions:
      - id: m05l2-q1-power-extension-cost
        prompt: "You are finalizing SPROUT's launch-venue extension set and reach for DefaultAccountState(Frozen) 'for safety.' What does the compatibility thesis predict?"
        multiSelect: false
        options:
          - id: d
            label: "Nothing breaks: the pool's vault is thawed at creation, so the frozen default never touches it"
            correct: false
            feedback: "The walk matches extension variants, so thawing every account in existence would not help. The DefaultAccountState entry itself is what pool creation refuses."
          - id: a
            label: "Fine: frozen-by-default is a display concern, so DEXes whitelist it like MetadataPointer."
            correct: false
            feedback: "DefaultAccountState is a control extension, not a display one; Raydium explicitly rejects DefaultAccountState(Frozen)."
          - id: c
            label: "It breaks routability: power/control extensions get refused; only fee, display and accounting extensions get whitelisted."
            correct: true
            feedback: "Fee, display and accounting extensions get whitelisted; power and control extensions get refused, and a frozen default is control. Reaching for one just in case costs you the venue."
          - id: b
            label: "Fine: as long as you also add TransferFeeConfig, the allowlisted extension covers the frozen one."
            correct: false
            feedback: "Allowlisting is not additive; one off-list extension taints the whole mint regardless of what else is present."
        explanation: "The thesis in one line, and note the word it must never contain: fee, display and accounting extensions (TransferFeeConfig, MetadataPointer, TokenMetadata, InterestBearingConfig, ScaledUiAmount) get whitelisted; power/control extensions (hook, permanent delegate, default-frozen, confidential) get refused. Do NOT say 'compliance gets whitelisted': DefaultAccountState(Frozen) is the compliance team's favourite primitive and this question is grading its refusal. Adding a control extension 'just in case' costs you the venue."
      - id: m05l2-q2-wallet-matrix-honesty
        prompt: "A teammate wants the README to publish 'Phantom shows the transfer-fee warning, Backpack doesn't, Solflare greys it out.' You ran no such test. What is the honest move for the routability report?"
        multiSelect: false
        options:
          - id: b
            label: "Publish it: the Token-2022 spec standardizes how each wallet must render every extension, so the table is safe to assert for any compliant wallet."
            correct: false
            feedback: "Per-wallet extension display is not standardized and was unverified this round; asserting it risks shipping wrong claims."
          - id: c
            label: "Publish it for Phantom only, since Phantom's behavior is documented in Raydium's allowlist."
            correct: false
            feedback: "Raydium's allowlist is a DEX pool-creation rule, not a wallet display spec; it says nothing about any wallet's UI."
          - id: a
            label: "Do not freeze the matrix: mark per-wallet display as unverified and point readers at the wallet they target."
            correct: true
            feedback: "Per-wallet extension display is not standardized and was not tested this round, so the report names it as an open item and sends the reader to the wallet they actually target."
          - id: d
            label: "Publish it with the date you checked attached, since a dated observation is what the course usually asks for when a claim drifts"
            correct: false
            feedback: "A date makes an observation checkable; it cannot manufacture one. Nothing was run here, so the dated version is a guess wearing the course's own honesty costume."
        explanation: "Phantom/Backpack/Solflare per-extension display behavior is unverified, so the report states it as 'verify in the wallet you target,' never a frozen matrix. The same honesty applies to Jupiter's Token-2022 routing policy, which its docs do not pin."
      - id: m05l2-q3-per-venue-scope
        prompt: "SPROUT ships with TransferFeeConfig + MetadataPointer + TokenMetadata and routes on Raydium CP-Swap. A colleague asks, 'so it'll route on Jupiter and in every wallet too, right?'"
        multiSelect: false
        options:
          - id: d
            label: "Mostly: venues key on the extension set, so a mint that clears one code allowlist usually clears another, and the report can say so with a caveat attached"
            correct: false
            feedback: "The mechanisms are not even the same kind. Orca grants per-mint approval by human review and Jupiter publishes no policy at all, so there is no base rate to generalize from, only venues to check."
          - id: c
            label: "Only if you also mint a classic SPL twin, since aggregators skip Token-2022 mints when they build routes."
            correct: false
            feedback: "Aggregators do handle Token-2022; the point is each has its own per-extension policy, not that they ignore the program."
          - id: b
            label: "Not necessarily: each venue sets its own rule (Orca's Token Badge, Jupiter's unstated policy); the report lists what you must still verify."
            correct: true
            feedback: "Each venue sets its own rule and some have not written it down, so the report ships the verified-routable set beside a named list of what is still open."
          - id: a
            label: "Yes: Raydium's five-extension allowlist is the ecosystem standard, and Jupiter, Orca, and every major wallet mirror it in their own routing and display checks."
            correct: false
            feedback: "There is no shared standard; Orca uses a Token Badge review and Jupiter's Token-2022 policy is not pinned in its docs."
        explanation: "Routability is per-venue. Raydium publishes a code allowlist, Orca gates some extensions behind a Token Badge, and Jupiter's routing policy is not found in its docs (a verify-at-write gap). The report captures the verified-routable set and names the venues still to verify, honestly."
